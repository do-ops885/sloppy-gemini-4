name: Update REAL WIRE

# INSTALL: copy this file to .github/workflows/update-wire.yml
# (the bot token cannot push into .github/workflows — needs a human or an app
# with the workflows permission; via web UI: Actions -> New workflow -> paste).
#
# Keeps the parody terminal fed with reality: REAL WIRE headlines (wire.json)
# and REAL ORACLE live prices from Polymarket/Kalshi (real-markets.json).
# Runs every 6 hours + on demand; commits back to main, which also retriggers
# the GitHub Pages deploy.

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6h at :17 — avoids the top-of-hour rush
  workflow_dispatch:          # manual: Actions -> Update REAL WIRE -> Run workflow

permissions:
  contents: write             # needed to push the wire.json commit

concurrency:
  group: wire-update
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest Gemini 4 Pro news -> wire.json
        run: node scripts/update-wire.mjs

      - name: Fetch real prediction-market prices -> real-markets.json
        run: node scripts/update-markets.mjs

      - name: Detect swings -> swings.json (+ optional Discord alert)
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/alert-swings.mjs

      - name: Commit if the wire changed
        run: |
          if git diff --quiet -- wire.json real-markets.json real-history.json swings.json; then
            echo "Feeds unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wire.json real-markets.json real-history.json swings.json
          git commit -m "chore(feeds): sync wire + real oracle prices [skip ci]"
          git push
